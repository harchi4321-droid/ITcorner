name: Build & Release ITCorner APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ITCorner VPN APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle Build Environment
        run: |
          # Ensure .env file exists for Secrets plugin
          if [ -f .env.example ]; then
            cp -n .env.example .env || true
          else
            touch .env
          fi

          # Ensure debug keystore is decoded or generated
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating new debug.keystore..."
            keytool -genkeypair -alias androiddebugkey -keypass android \
              -keystore debug.keystore -storepass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -validity 10000 -keyalg RSA -keysize 2048
          fi

          # Ensure gradlew executable exists and has proper permissions
          if [ ! -f "gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradlew or wrapper jar missing. Generating via gradle wrapper..."
            sudo apt-get update -qq && sudo apt-get install -y -qq gradle
            gradle wrapper --gradle-version 8.11.1
          fi

          # Fix line endings and add execute permissions
          sed -i 's/\r$//' gradlew || true
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK Generated
        run: |
          ls -la app/build/outputs/apk/debug/
          find app/build/outputs/apk -name "*.apk"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ITCorner-VPN-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          tag_name: ${{ github.ref_name || 'latest' }}
          name: "ITCorner VPN Release ${{ github.ref_name || 'Latest' }}"
          body: |
            ### 🇲🇲 ITCorner VPN Android App
            - High-Speed Singapore & Thailand Low-Latency Routes
            - Anti-DPI Stealth & Fast Anti-Censorship DNS Tunnel
            - Myanmar Banking Split-Tunneling (KBZPay, WavePay, AYA Pay, CB Pay)
            - Live Speed Test & Real-Time Traffic Counters
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
